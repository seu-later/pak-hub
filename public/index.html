<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030806">
    <meta name="description" content="Browse and download community Deep Rock Galactic pak mods from Pak Hub.">
    <title>Pak Hub — Pak List</title>
    <script src="scene-position.js?v=20261014handoff2"></script>
    <link rel="preload" href="assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/WhiteRabbit.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/city-still.webp" as="image" media="(max-width: 700px)">
    <link rel="preload" href="assets/city-far-still.webp" as="image" media="(min-width: 701px)">
    <link rel="preload" href="assets/city-near-still.webp" as="image" media="(min-width: 701px)">
    <link rel="stylesheet" href="assets/lenis.css?v=1.3.26">
    <link rel="stylesheet" href="styles.css?v=20261014handoff2">
    <script src="assets/lenis.min.js?v=1.3.26" defer></script>
    <script src="assets/gsap.min.js?v=3.15.0" defer></script>
    <script src="site-motion.js?v=20261014handoff2" defer></script>
    <script src="preview-data.js?v=20261013b" defer></script>
    <script src="app.js?v=20261013city2" defer></script>
  </head>
  <body class="view-list">
    <div class="scene-background" aria-hidden="true">
      <div class="scene-fallback"></div>
      <div id="scene-canvas"></div>
      <div class="scene-handoff"></div>
    </div>
    <a class="skip-link" href="#catalog">Skip to the pak list</a>
    <div id="site-loader" class="site-loader" role="status" aria-label="Loading Pak Hub" hidden>
      <div class="site-loader-background"></div>
      <div class="site-loader-row" aria-hidden="true">
        <span id="site-loader-count" class="site-loader-count">0%</span>
        <div class="site-loader-track">
          <span id="site-loader-line" class="site-loader-line"></span>
          <span class="site-loader-head"></span>
        </div>
      </div>
    </div>
    <div class="app-shell" id="app-shell">
      <header class="site-header">
        <div class="header-inner">
          <nav class="primary-nav" aria-label="Primary navigation">
            <a href="index.html" aria-current="page">Pak List</a>
            <a href="dump.html">Pak Dump</a>
            <a href="dependencies.html">Dependencies</a>
            <a href="about.html">About</a>
            <span class="nav-indicator" aria-hidden="true"></span>
          </nav>
        </div>
      </header>

      <main id="catalog" class="catalog-stage" aria-labelledby="page-title">
        <div class="catalog-inner">
          <h1 id="page-title" class="visually-hidden">Pak list</h1>
          <section class="archive-shell" aria-label="Pak mod archive">
            <div id="archive-toolbar" class="archive-toolbar">
              <h2 class="archive-title">Pak list</h2>
              <div class="archive-heading-group">
                <button id="search-toggle" class="search-toggle" type="button" aria-label="Open search" aria-expanded="false" aria-controls="search-form">
                  <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 4.7 4.7"></path>
                  </svg>
                  <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18"></path>
                  </svg>
                </button>
              </div>
              <form id="search-form" class="search-bar" role="search" aria-hidden="true">
                <label class="visually-hidden" for="search-field">Search pak mods</label>
                <input id="search-field" name="q" type="search" maxlength="100" autocomplete="off" tabindex="-1">
                <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" tabindex="-1" hidden>
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"></path></svg>
                </button>
              </form>
              <div class="archive-controls">
                <div class="sort-controls" role="group" aria-label="Sort mods">
                  <button class="sort-button" type="button" data-sort="name" aria-label="Sort by mod name">Name</button>
                  <button class="sort-button sort-active" type="button" data-sort="newest" aria-label="Sort by newest post"><span class="sort-label">Newest</span> <span class="sort-caret" aria-hidden="true"></span></button>
                  <span class="sort-indicator" aria-hidden="true"></span>
                </div>
                <span id="result-count" class="result-count" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div class="catalog-workspace" aria-label="Pak list browser">
              <section class="catalog-list-panel" aria-label="Pak list">
                <div class="list-columns" aria-hidden="true"><span class="column-name">Name</span><span class="column-author">Posted by</span><span>Files</span></div>
                <div class="list-view">
                  <table class="ledger-table" aria-label="Pak list">
                    <thead class="visually-hidden">
                      <tr><th scope="col">Pak list entry</th></tr>
                    </thead>
                    <tbody id="mod-rows"></tbody>
                  </table>
                  <div id="load-sentinel" class="load-sentinel" aria-hidden="true" hidden></div>
                </div>
              </section>
              <aside id="detail-panel" class="detail-panel" data-lenis-prevent aria-label="Pak post preview" aria-busy="false" tabindex="-1">
                <div class="preview-panel-controls"><button type="button" class="preview-back">Back to list</button></div>
                <div id="detail-panel-content"></div>
              </aside>
            </div>
            <div id="archive-state" class="archive-state" role="status" aria-live="polite" hidden></div>
            <div class="archive-footer">
              <button id="load-more" class="load-more" type="button" hidden>More</button>
            </div>
          </section>
        </div>
      </main>

      <p id="live-status" class="visually-hidden" role="status" aria-live="polite"></p>
    </div>
  </body>
</html>
